# Render "Blueprint" - lets you deploy with New + Blueprint instead of clicking through
# individual settings. See README.md "Deploying to Render" for the manual-click steps too.
services:
  - type: web
    name: aceify
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
